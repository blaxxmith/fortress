[package]
name = "fortress"
version = "1.0.0"
edition = "2024"
description = "A simple password safe CLI app"
authors = ["Blaxxmith", "Axxiar"]
repository = "github.com/xavier2p/fortress"
readme = "README.md"
rust-version = "1.100"

[[bin]]
name = "frtrs"
path = "src/main.rs"

[dependencies]
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.9", features = ["derive"] }
serde_json = "1.0.154"
rpassword = "7.5.5"
argon2 = "0.6.0"
cli-clipboard = "0.4.0"
aes-gcm = "0.11.1"
password-strength = "1.0.0"
log = "0.4"
simplelog = "0.12"
